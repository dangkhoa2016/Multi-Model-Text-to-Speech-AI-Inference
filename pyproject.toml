[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-ai-inference"
version = "1.0.0"
description = "Model-aware TTS API gateway and isolated Modal GPU workers"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "cryptography>=43,<47", "redis>=5,<9"]

[project.optional-dependencies]
modal = ["modal>=1.6,<2", "huggingface_hub>=0.33,<2"]
dev = ["pytest>=8,<10", "uvicorn>=0.30,<1", "ruff==0.17.5", "alembic>=1.13,<2", "fakeredis>=2.25,<3", "huggingface_hub>=0.33,<2"]

[tool.setuptools.packages.find]
include = ["tts_inference*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
