name: Python CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest -q
      - run: python scripts/validate_notebook.py
      - run: alembic upgrade head
        env:
          TEXT_TO_SPEECH_POSTGRESQL_DATABASE_URL: sqlite+pysqlite:///./ci_schema_check.sqlite3
      - run: python -m compileall -q tts_inference modal_app.py migrations scripts
      - run: python scripts/verify_source_checksums.py --check
      - run: sha256sum -c SHA256SUMS.txt

  postgres-redis-integration:
    name: PostgreSQL 16 and Redis 7 CPU integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tts_validation_test
          POSTGRES_USER: tts_test
          POSTGRES_PASSWORD: tts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tts_test -d tts_validation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEXT_TO_SPEECH_POSTGRESQL_DATABASE_URL: postgresql+psycopg://tts_test:tts_test@localhost:5432/tts_validation_test
      TTS_INTEGRATION_POSTGRESQL_URL: postgresql+psycopg://tts_test:tts_test@localhost:5432/tts_validation_test
      # Only the isolated CI network uses plaintext Redis.
      TTS_INTEGRATION_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q tests/test_real_postgresql_redis_integration.py
