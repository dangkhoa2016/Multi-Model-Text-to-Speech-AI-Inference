name: Python CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check tts_inference tests scripts
      - run: python -m pytest -q
      - run: python scripts/validate_notebook.py
      - run: alembic upgrade head
        env:
          TEXT_TO_SPEECH_POSTGRESQL_DATABASE_URL: sqlite+pysqlite:///./ci_schema_check.sqlite3
      - run: python -m compileall -q tts_inference modal_app.py migrations scripts
      - run: sha256sum -c SHA256SUMS.txt
