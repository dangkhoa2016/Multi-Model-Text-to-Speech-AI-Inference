name: Feature request
description: Suggest an API, model, or documentation improvement.
title: "Feature: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and use case
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected model/component and compatibility
      description: Consider model options, license and GPU cost.
    validations:
      required: true
